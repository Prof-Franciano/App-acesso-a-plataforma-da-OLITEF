<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Acesso OLITEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos Básicos */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #2088FE; /* Azul vibrante OLITEF */
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Layout Principal: 3 Colunas preenchendo toda a largura */
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            flex-grow: 1;
        }

        /* Imagens Laterais */
        .side-image {
            flex: 1; 
            display: flex;
            align-items: center; /* Centraliza verticalmente na coluna */
            justify-content: center;
            background-color: #2088FE; /* Mantém o fundo azul nas sobras */
        }
        
        .side-image img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ALTERAÇÃO AQUI: Garante que a imagem caiba inteira sem cortar */
            object-position: center;
        }

        /* Coluna Central (Logotipo + Caixa de Pesquisa + Resultados) */
        .center-column {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 40px;
            gap: 30px; /* Reduzido o gap para acomodar o logo */
            background-color: #2088FE; 
            z-index: 10;
        }

        /* Logotipo Central */
        .center-logo {
            width: 100%;
            text-align: center;
            margin-bottom: -10px; /* Aproxima um pouco o logo da caixa branca */
        }
        
        .center-logo img {
            max-width: 500px; /* Ajuste o tamanho do logotipo aqui */
            height: auto;
        }

        /* Caixa de Pesquisa */
        .search-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
            text-align: center;
        }
        
        .search-container h2 {
            color: #044C73;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .search-container p.subtitle {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        
        input:focus {
            border-color: #2088FE;
        }
        
        button {
            background-color: #2ECC71; 
            color: white;
            border: none;
            padding: 16px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #27AE60;
        }

        /* Áreas de Resultado e Erro */
        .result, .error {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            display: none;
        }
        
        .result {
            background-color: #f0fdf4;
            border-left: 5px solid #2ECC71;
        }
        
        .result p {
            margin: 8px 0;
            font-size: 16px;
        }
        
        .error {
            background-color: #fef2f2;
            color: #dc2626;
            border-left: 5px solid #dc2626;
            font-weight: 600;
        }

        /* Imagem Inferior (Resultados da Edição Anterior) */
        .bottom-image {
            width: 100%;
            max-width: 500px; /* Igualado ao tamanho da caixa de pesquisa */
            display: flex;
            justify-content: center;
        }
        
        .bottom-image img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Responsividade */
        @media (max-width: 1000px) {
            .main-content {
                flex-direction: column;
                gap: 0px; /* Espaço entre as imagens e a coluna central */
            }
            .side-image {
                /* Removemos o display: none para que elas apareçam */
                display: flex; 
                width: 100%;
                padding: 10px 0;
            }
            .side-image img {
                max-height: 1000px; /* Limita a altura para não ocupar a tela toda do celular */
                object-fit: contain;
            }
            .center-column {
                padding: 1px 2px; /* Ajusta o respiro lateral para celulares */
            }
        }
    </style>
</head>

        function buscarDados() {
            const inputNome = document.getElementById('nomeAluno').value.trim().toUpperCase();
            const divResultado = document.getElementById('resultado');
            const divErro = document.getElementById('mensagemErro');
            
            divResultado.style.display = 'none';
            divErro.style.display = 'none';

            if (inputNome === "") return;

            const alunoEncontrado = alunos.find(aluno => aluno.NOME === inputNome);

            if (alunoEncontrado) {
                document.getElementById('resNome').innerText = alunoEncontrado.NOME;
                document.getElementById('resSerie').innerText = alunoEncontrado.SÉRIE;
                document.getElementById('resTurma').innerText = alunoEncontrado.TURMA;
                document.getElementById('resLogin').innerText = alunoEncontrado.LOGIN;
                document.getElementById('resSenha').innerText = alunoEncontrado.SENHA;
                
                divResultado.style.display = 'block';
            } else {
                divErro.style.display = 'block';
            }
        }

        document.getElementById('nomeAluno').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                buscarDados();
            }
        });
    </script>
